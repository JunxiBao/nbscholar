<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="一站式科研信息服务门户 — 简化操作、降低门槛，助力基层科研人员高效开展学术研究" />
  <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#1C1C1E" media="(prefers-color-scheme: dark)" />
  <link id="favicon" rel="icon" type="image/png" href="statics/images/lighticon.png?v=3" />
  <title>甬学阁 — 一站式科研信息服务门户</title>

  <!-- Ionic -->
  <script type="module" src="https://cdn.jsdelivr.net/npm/@ionic/core/dist/ionic/ionic.esm.js"></script>
  <script nomodule src="https://cdn.jsdelivr.net/npm/@ionic/core/dist/ionic/ionic.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@ionic/core/css/ionic.bundle.css" />

  <!-- Ionicons -->
  <script type="module" src="https://cdn.jsdelivr.net/npm/ionicons/dist/ionicons/ionicons.esm.js"></script>
  <script nomodule src="https://cdn.jsdelivr.net/npm/ionicons/dist/ionicons/ionicons.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>

  <link rel="stylesheet" href="css/theme.css" />

  <style>
    html { background: var(--bg-base, #F5F5F7); }
    html[data-theme="dark"] { background: #000000; color-scheme: dark; }
    html[data-theme="light"] { background: #F5F5F7; color-scheme: light; }
  </style>
</head>
<body>

<!-- 侧边栏遮罩 (移动端) -->
<div id="sidebar-overlay" onclick="closeSidebar()"></div>

<div class="app-shell">

  <!-- ===== 侧边栏 ===== -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-logo">
        <img class="app-logo logo-light" src="statics/images/lighticon.png" alt="Logo" style="width: 40px; height: 40px; border-radius: 50%; object-fit: contain; flex-shrink: 0;">
        <img class="app-logo logo-dark" src="statics/images/darkicon.png" alt="Logo" style="width: 40px; height: 40px; border-radius: 50%; object-fit: contain; flex-shrink: 0; transform: scale(1.2);">
        <div>
          <div class="sidebar-logo-name">甬学阁</div>
          <div class="sidebar-logo-sub">科研信息服务门户</div>
        </div>
      </div>
    </div>

    <nav class="sidebar-nav" style="position: relative;">
      <div class="sidebar-indicator" id="sidebar-indicator"></div>
      <div class="sidebar-section">主要功能</div>
      <div class="nav-item active" data-tab="tab-home">
        <ion-icon name="home-outline"></ion-icon>首页概览
      </div>
      <div class="nav-item" data-tab="tab-search">
        <ion-icon name="search-outline"></ion-icon>学术资源检索
      </div>
      <div class="nav-item" data-tab="tab-tools">
        <ion-icon name="flash-outline"></ion-icon>智能工具
      </div>
      <div class="nav-item" data-tab="tab-data">
        <ion-icon name="cloud-upload-outline"></ion-icon>数据存缴指引
      </div>
      <div class="nav-item" data-tab="tab-journal">
        <ion-icon name="newspaper-outline"></ion-icon>期刊投稿服务
      </div>
      <div class="nav-item" data-tab="tab-training">
        <ion-icon name="school-outline"></ion-icon>公益培训报名
      </div>

      <div class="sidebar-section">我的账户</div>
      <div class="nav-item" data-tab="tab-favorites">
        <ion-icon name="bookmark-outline"></ion-icon>收藏夹
        <span class="nav-count">2</span>
      </div>
      <div class="nav-item" data-tab="tab-history">
        <ion-icon name="time-outline"></ion-icon>检索历史
      </div>
      <div class="nav-item" data-tab="tab-settings">
        <ion-icon name="settings-outline"></ion-icon>偏好设置
      </div>
    </nav>

    <div class="sidebar-footer">
      <div class="sidebar-user" onclick="toggleUserPopover(event)" style="cursor:pointer;">
        <img class="avatar" src="statics/images/wang.png" alt="王" style="width:32px;height:32px;object-fit:cover;">
        <div style="flex:1;min-width:0;">
          <div style="font-size:13px;font-weight:600;color:var(--text-primary);">王研究员</div>
          <div style="font-size:11px;color:var(--text-secondary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">中国科学院</div>
        </div>
      </div>
    </div>
  </aside>

  <!-- ===== 主区域 ===== -->
  <div class="main-area">

    <!-- 顶栏 -->
    <header class="topbar">
      <!-- 移动端汉堡按钮 -->
      <button class="topbar-menu-btn" id="sidebar-toggle" onclick="toggleSidebar()" aria-label="菜单">
        <ion-icon name="menu-outline"></ion-icon>
      </button>

      <!-- 移动端 Logo -->
      <div class="topbar-logo">
        <img class="app-logo logo-light" src="statics/images/lighticon.png" alt="Logo" style="width: 32px; height: 32px; border-radius: 50%; object-fit: contain; flex-shrink: 0;">
        <img class="app-logo logo-dark" src="statics/images/darkicon.png" alt="Logo" style="width: 32px; height: 32px; border-radius: 50%; object-fit: contain; flex-shrink: 0; transform: scale(1.2);">
        <span class="topbar-brand">甬学阁</span>
      </div>

      <!-- 宽屏页面标题 -->
      <div class="topbar-page-title" id="topbar-title">首页概览</div>

      <!-- 操作按钮 -->
      <div class="topbar-actions">


        <!-- 移动端/顶部用户图标 -->
        <button class="topbar-btn" id="mobile-avatar" onclick="toggleUserPopover(event)" title="账户选项">
          <ion-icon name="person-circle-outline"></ion-icon>
        </button>
      </div>
    </header>

    <!-- 页面内容 -->
    <main class="page-content" id="main-content">
      <!-- 动态注入 -->
    </main>

    <!-- ===== 底部标签栏 (移动端，必须在 main-area 内) ===== -->
    <nav class="bottom-tabs" id="bottom-tabs">
      <div class="tab-indicator tab-home" id="tab-indicator"></div>
      <button class="tab-btn active" data-tab="tab-home"
              data-icon-outline="home-outline"
              data-icon-filled="home">
        <ion-icon name="home"></ion-icon>
        <span>首页</span>
      </button>
      <button class="tab-btn" data-tab="tab-search"
              data-icon-outline="search-outline"
              data-icon-filled="search">
        <ion-icon name="search-outline"></ion-icon>
        <span>检索</span>
      </button>
      <button class="tab-btn" data-tab="tab-tools"
              data-icon-outline="flash-outline"
              data-icon-filled="flash">
        <ion-icon name="flash-outline"></ion-icon>
        <span>工具</span>
      </button>
      <button class="tab-btn" data-tab="tab-data"
              data-icon-outline="cloud-upload-outline"
              data-icon-filled="cloud-upload">
        <ion-icon name="cloud-upload-outline"></ion-icon>
        <span>存缴</span>
      </button>
      <button class="tab-btn" data-tab="tab-journal"
              data-icon-outline="newspaper-outline"
              data-icon-filled="newspaper">
        <ion-icon name="newspaper-outline"></ion-icon>
        <span>投稿</span>
      </button>
      <button class="tab-btn" data-tab="tab-training"
              data-icon-outline="school-outline"
              data-icon-filled="school">
        <ion-icon name="school-outline"></ion-icon>
        <span>培训</span>
      </button>
    </nav>

  </div><!-- /.main-area -->
</div><!-- /.app-shell -->



<!-- Toast -->
<div id="toast" style="display:none;"></div>

<!-- 用户菜单 Popover -->
<div id="user-popover" class="user-popover">
  <div class="popover-item" onclick="switchTab('tab-favorites'); toggleUserPopover()">
    <ion-icon name="bookmark-outline"></ion-icon>收藏夹
  </div>
  <div class="popover-item" onclick="switchTab('tab-history'); toggleUserPopover()">
    <ion-icon name="time-outline"></ion-icon>检索历史
  </div>
  <div class="popover-item" onclick="switchTab('tab-settings'); toggleUserPopover()">
    <ion-icon name="settings-outline"></ion-icon>偏好设置
  </div>
</div>

<script src="js/pages/home.js"></script>
<script src="js/pages/search.js"></script>
<script src="js/pages/tools.js"></script>
<script src="js/pages/deposit.js"></script>
<script src="js/pages/journal.js"></script>
<script src="js/pages/training.js"></script>
<script src="js/app.js"></script>
  <script src="js/index.js"></script>
</body>
</html>
