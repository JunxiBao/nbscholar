    <nav class="sidebar-nav" style="position: relative;">

      </div>
      <div class="nav-item" data-tab="tab-training">
        <ion-icon name="school-outline"></ion-icon>公益培训报名
      </div>

      <div class="sidebar-section">我的账户</div>
      <div class="nav-item" data-tab="tab-favorites">
        <ion-icon name="bookmark-outline"></ion-icon>收藏夹
        <span class="nav-count">2</span>

      <div class="nav-item" data-tab="tab-history">

      <div class="nav-item" data-tab="tab-settings">

    <div class="sidebar-footer">
      <div class="sidebar-user" onclick="toggleUserPopover(event)" style="cursor:pointer;">
        <img class="avatar" src="statics/images/wang.png" alt="王" style="width:32px;height:32px;object-fit:cover;">
        <div style="flex:1;min-width:0;">

  <!-- ===== 主区域 ===== -->
  <div class="main-area">

    <!-- 顶栏 -->
    <header class="topbar">
      <!-- 移动端汉堡按钮 -->
      <button class="topbar-menu-btn" id="sidebar-toggle" onclick="toggleSidebar()" aria-label="菜单">
        <ion-icon name="menu-outline"></ion-icon>
      </button>

      <!-- 移动端 Logo -->
      <div class="topbar-logo">
        <img class="app-logo logo-light" src="statics/images/lighticon.png" alt="Logo" style="width: 64px; height: 64px; border-radius: 50%; object-fit: contain; flex-shrink: 0; margin-left: -10px; margin-right: -18px;">
        <img class="app-logo logo-dark" src="statics/images/darkicon.png" alt="Logo" style="width: 64px; height: 64px; border-radius: 50%; object-fit: contain; flex-shrink: 0; margin-left: -10px; margin-right: -18px;">
        <span class="topbar-brand">甬学阁</span>
      </div>

      <!-- 宽屏页面标题 -->
      <div class="topbar-page-title" id="topbar-title">首页概览</div>

      <!-- 操作按钮 -->
      <div class="topbar-actions">
        <!-- 深色模式切换 -->
        <button class="topbar-btn" id="theme-toggle" onclick="toggleTheme(event)" title="切换深浅色">

    </header>

    <!-- 页面内容 -->
    <main class="page-content" id="main-content">
      <!-- 动态注入 -->
    </main>

    <!-- ===== 底部标签栏 (移动端，必须在 main-area 内) ===== -->
    <nav class="bottom-tabs" id="bottom-tabs">
      <div class="tab-indicator tab-home" id="tab-indicator"></div>
      <button class="tab-btn active" data-tab="tab-home"
              data-icon-outline="home-outline"
              data-icon-filled="home">
        <ion-icon name="home"></ion-icon>
        <span>首页</span>
      </button>
      <button class="tab-btn" data-tab="tab-search"
              data-icon-outline="search-outline"
              data-icon-filled="search">
        <ion-icon name="search-outline"></ion-icon>
        <span>检索</span>
      </button>
      <button class="tab-btn" data-tab="tab-tools"
              data-icon-outline="flash-outline"
              data-icon-filled="flash">
        <ion-icon name="flash-outline"></ion-icon>
        <span>工具</span>
      </button>
      <button class="tab-btn" data-tab="tab-data"
              data-icon-outline="cloud-upload-outline"
              data-icon-filled="cloud-upload">
        <ion-icon name="cloud-upload-outline"></ion-icon>
        <span>存缴</span>
      </button>
      <button class="tab-btn" data-tab="tab-journal"
              data-icon-outline="newspaper-outline"
              data-icon-filled="newspaper">
        <ion-icon name="newspaper-outline"></ion-icon>
        <span>投稿</span>
      </button>
      <button class="tab-btn" data-tab="tab-training"
              data-icon-outline="school-outline"
              data-icon-filled="school">
        <ion-icon name="school-outline"></ion-icon>
        <span>培训</span>
      </button>
    </nav>

  </div><!-- /.main-area -->
</div><!-- /.app-shell -->



<!-- Toast -->
<div id="toast" style="display:none;"></div>

<!-- 用户菜单 Popover -->
<div id="user-popover" class="user-popover">
  <div class="popover-item" onclick="switchTab('tab-favorites'); toggleUserPopover()">
    <ion-icon name="bookmark-outline"></ion-icon>收藏夹
  </div>
  <div class="popover-item" onclick="switchTab('tab-history'); toggleUserPopover()">
    <ion-icon name="time-outline"></ion-icon>检索历史
  </div>
  <div class="popover-item" onclick="switchTab('tab-settings'); toggleUserPopover()">
    <ion-icon name="settings-outline"></ion-icon>偏好设置
  </div>
</div>

<script src="js/app.js"></script>
<script>
  // ===== 平台检测 =====
  (function detectPlatform() {
    const ua = navigator.userAgent;
    // Capacitor 原生信息
    const cap = window.Capacitor;
    let platform = 'android'; // 网页端默认 Android MD3 风格

    if (cap) {
      // Capacitor 封装模式：直接读取平台
      platform = cap.getPlatform?.() || cap.platform || 'web';
    } else {
      // 纯 Web UA 检测
      if (/iPhone|iPad|iPod/.test(ua)) platform = 'ios';
      else if (/Android/.test(ua)) platform = 'android';
    }

    // 写入 html 属性（CSS 选择器依据）
    document.documentElement.setAttribute('data-platform', platform);

    // iOS 配置邨底安全区颜色
    const metaTheme = document.querySelector('meta[name="theme-color"]');
    if (platform === 'ios') {
      // Safari 状态栏
      document.querySelector('meta[name="apple-mobile-web-app-capable"]')?.remove();
      const cap1 = document.createElement('meta');
      cap1.name = 'apple-mobile-web-app-capable';
      cap1.content = 'yes';
      document.head.appendChild(cap1);
      const cap2 = document.createElement('meta');
      cap2.name = 'apple-mobile-web-app-status-bar-style';
      cap2.content = 'default';
      document.head.appendChild(cap2);
    }

    // Android 注入 MD3 涟漪事件
    if (platform === 'android') {
      document.addEventListener('click', function(e) {
        const btn = e.target.closest('.tab-btn');
        if (!btn) return;
        // 创建涟漪元素
        const ripple = document.createElement('span');
        ripple.className = 'md-ripple';
        const rect = btn.getBoundingClientRect();
        const size = Math.max(rect.width, rect.height) * 0.6;
        ripple.style.cssText = `
          width: ${size}px; height: ${size}px;
          left: ${e.clientX - rect.left - size/2}px;
          top:  ${e.clientY - rect.top  - size/2}px;
        `;
        btn.appendChild(ripple);
        ripple.addEventListener('animationend', () => ripple.remove());
      }, true);
    }

    console.log('[甬学阁] Platform:', platform);
  })();

  // ===== 深色模式初始化 =====
  (function initTheme() {
    const saved = localStorage.getItem('theme');
    const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    const isDark = saved ? saved === 'dark' : prefersDark;
    if (isDark) {
      document.documentElement.setAttribute('data-theme', 'dark');
      const icon = document.getElementById('theme-icon');
      if (icon) icon.name = 'sunny-outline';
      const fav = document.getElementById('favicon');
      if (fav) fav.href = 'statics/images/darkicon.png';
    }
  })();

  function toggleTheme(event) {
    const isDark = document.documentElement.getAttribute('data-theme') === 'dark';

    const switchTheme = () => {
      const html = document.documentElement;
      const icon = document.getElementById('theme-icon');
      const fav = document.getElementById('favicon');
      if (isDark) {
        html.removeAttribute('data-theme');
        localStorage.setItem('theme', 'light');
        if (icon) icon.name = 'moon-outline';
        if (fav) fav.href = 'statics/images/lighticon.png';
      } else {
        html.setAttribute('data-theme', 'dark');
        localStorage.setItem('theme', 'dark');
        if (icon) icon.name = 'sunny-outline';
        if (fav) fav.href = 'statics/images/darkicon.png';
      }
    };

    if (!document.startViewTransition || !event) {
      switchTheme();
      return;
    }

    const x = event.clientX;
    const y = event.clientY;
    const endRadius = Math.hypot(
      Math.max(x, innerWidth - x),
      Math.max(y, innerHeight - y)
    );

    const transition = document.startViewTransition(() => {
      switchTheme();
    });

    transition.ready.then(() => {
      document.documentElement.animate(
        {
          clipPath: [
            `circle(0px at ${x}px ${y}px)`,
            `circle(${endRadius}px at ${x}px ${y}px)`
          ]
        },
        {
          duration: 500,
          easing: "ease-in-out",
          pseudoElement: "::view-transition-new(root)"
        }
      );
    });
  }

  // ===== 移动端侧边栏 =====
  function toggleSidebar() {
    const sb = document.getElementById('sidebar');
    const ov = document.getElementById('sidebar-overlay');
    sb.classList.toggle('open');
    ov.classList.toggle('show');
  }

  function closeSidebar() {
    document.getElementById('sidebar').classList.remove('open');
    document.getElementById('sidebar-overlay').classList.remove('show');
  }

  // UI 更新
  function updateMobileUI() {
    const isMobile = window.innerWidth < 900;
    const avatar = document.getElementById('mobile-avatar');
    if (avatar) avatar.style.display = 'block'; // Always show
  }

  updateMobileUI();
  window.addEventListener('resize', updateMobileUI);

  // 系统深色模式变化
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', e => {
    if (!localStorage.getItem('theme')) {
      const icon = document.getElementById('theme-icon');
      const fav = document.getElementById('favicon');
      if (e.matches) {
        document.documentElement.setAttribute('data-theme', 'dark');
        if (icon) icon.name = 'sunny-outline';
        if (fav) fav.href = 'statics/images/darkicon.png';
      } else {
        document.documentElement.removeAttribute('data-theme');
        if (icon) icon.name = 'moon-outline';
        if (fav) fav.href = 'statics/images/lighticon.png';
      }
    }
  });
</script>
</body>
</html>
