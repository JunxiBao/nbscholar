<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="甬学阁 — 超级管理员审批控制台" />
  <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#1C1C1E" media="(prefers-color-scheme: dark)" />
  <link id="favicon" rel="icon" type="image/png" href="statics/images/lighticon.png?v=3" />
  <title>甬学阁 — 超级管理员控制台</title>

  <!-- Ionic -->
  <script type="module" src="https://cdn.jsdelivr.net/npm/@ionic/core/dist/ionic/ionic.esm.js"></script>
  <script nomodule src="https://cdn.jsdelivr.net/npm/@ionic/core/dist/ionic/ionic.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@ionic/core/css/ionic.bundle.css" />

  <link rel="stylesheet" href="css/theme.css" />
  <link rel="stylesheet" href="css/login.css" />

  <style>
    html { background: var(--bg-base, #F5F5F7); }
    html[data-theme="dark"] { background: #000000; color-scheme: dark; }
    html[data-theme="light"] { background: #F5F5F7; color-scheme: light; }
    
    @media (min-width: 900px) {
      #mobile-avatar-btn {
        display: flex !important;
      }
    }
  </style>
</head>
<body>

<!-- 侧边栏遮罩 (移动端) -->
<div id="sidebar-overlay" onclick="closeSidebar()"></div>
<div class="app-shell" id="app-shell" style="display:none;">
  <!-- ===== 左侧边栏 ===== -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-logo">
        <img class="app-logo logo-light" src="statics/images/lighticon.png" alt="Logo" style="width: 40px; height: 40px; border-radius: 50%; object-fit: contain; flex-shrink: 0;">
        <img class="app-logo logo-dark" src="statics/images/darkicon.png" alt="Logo" style="width: 40px; height: 40px; border-radius: 50%; object-fit: contain; flex-shrink: 0; transform: scale(1.2);">
        <div>
          <div class="sidebar-logo-name">甬学阁</div>
          <div class="sidebar-logo-sub">超级管理后台</div>
        </div>
      </div>
    </div>

    <nav class="sidebar-nav" style="position: relative;">
      <div class="sidebar-indicator" id="sidebar-indicator"></div>
      <div class="sidebar-section">账号审批</div>
      <div class="nav-item active" data-tab="pending" onclick="switchSuperTab('pending')">
        <ion-icon name="hourglass-outline"></ion-icon>待审批申请
      </div>
      <div class="nav-item" data-tab="history" onclick="switchSuperTab('history')">
        <ion-icon name="time-outline"></ion-icon>审批记录
      </div>
    </nav>

    <div class="sidebar-footer">
      <div class="sidebar-user" onclick="toggleUserPopover(event)" style="cursor:pointer;">
        <img class="avatar" id="sidebar-avatar" src="statics/images/wang.png" alt="User" style="width:32px;height:32px;object-fit:cover;">
        <div style="flex:1;min-width:0;">
          <div style="font-size:13px;font-weight:600;color:var(--text-primary);" id="sidebar-name">正在加载...</div>
          <div style="font-size:11px;color:var(--text-secondary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;" id="sidebar-institution"></div>
        </div>
      </div>
    </div>
  </aside>

  <!-- ===== 主区域 ===== -->
  <div class="main-area">
    <header class="topbar">
      <!-- 移动端汉堡按钮 -->
      <button class="topbar-menu-btn" id="sidebar-toggle" onclick="toggleSidebar()" aria-label="菜单">
        <ion-icon name="menu-outline"></ion-icon>
      </button>

      <!-- 移动端 Logo -->
      <div class="topbar-logo">
        <img class="app-logo logo-light" src="statics/images/lighticon.png" alt="Logo" style="width: 32px; height: 32px; border-radius: 50%; object-fit: contain; flex-shrink: 0;">
        <img class="app-logo logo-dark" src="statics/images/darkicon.png" alt="Logo" style="width: 32px; height: 32px; border-radius: 50%; object-fit: contain; flex-shrink: 0; transform: scale(1.2);">
        <span class="topbar-brand">超级管理后台</span>
      </div>

      <!-- 宽屏页面标题 -->
      <div class="topbar-page-title" id="topbar-title">账号审批</div>

      <!-- 操作按钮 -->
      <div class="topbar-actions">
        <!-- 右侧动作 -->
        <button class="topbar-btn" id="mobile-avatar-btn" onclick="toggleUserPopover(event)" title="账户选项" style="padding:0; background:transparent;">
          <ion-icon id="mobile-avatar-icon" name="person-circle-outline" style="font-size:28px;"></ion-icon>
        </button>
      </div>
    </header>

    <main class="page-content" id="main-content">
      <div class="page-1col" style="max-width:800px; margin:0 auto; padding-top:20px; padding-bottom:32px;">
        <!-- 统计面板 -->
        <div class="stat-row fade-up d1" style="padding-top:16px;">
          <div class="stat-card">
            <div class="stat-val" id="stat-pending-cnt" style="color:var(--blue-600);">-</div>
            <div class="stat-lbl">待审批申请</div>
          </div>
          <div class="stat-card">
            <div class="stat-val" id="stat-history-cnt" style="color:var(--green-600);">-</div>
            <div class="stat-lbl">已处理记录</div>
          </div>
        </div>

        <div id="section-pending">
          <div class="section-label fade-up d2">待审批管理员 <span id="pending-count-label" style="font-weight:400;color:var(--text-secondary);"></span></div>
          <div id="pending-list" class="fade-up d3">
            <!-- 动态加载列表 -->
          </div>
        </div>
        
        <div id="section-history" style="display:none;">
          <div class="section-label fade-up d2">审批历史记录 <span id="history-count-label" style="font-weight:400;color:var(--text-secondary);"></span></div>
          <div id="history-list" class="fade-up d3">
            <!-- 动态加载列表 -->
          </div>
        </div>
      </div>
    </main>

    <!-- ===== 底部标签栏 (移动端) ===== -->
    <nav class="bottom-tabs" id="bottom-tabs" style="--tab-count: 2;">
      <div class="tab-indicator pending" id="tab-indicator"></div>
      <button class="tab-btn active" data-tab="pending" onclick="switchSuperTab('pending')"
              data-icon-outline="hourglass-outline"
              data-icon-filled="hourglass">
        <ion-icon name="hourglass"></ion-icon>
        <span>待审批申请</span>
      </button>
      <button class="tab-btn" data-tab="history" onclick="switchSuperTab('history')"
              data-icon-outline="time-outline"
              data-icon-filled="time">
        <ion-icon name="time-outline"></ion-icon>
        <span>审批记录</span>
      </button>
    </nav>

  </div><!-- /.main-area -->
</div>

<!-- ===== 登录层 ===== -->
<div id="auth-layer" style="position:fixed; top:0; left:0; width:100%; height:100%; z-index:9999; background:var(--bg-base); display:flex; justify-content:center; align-items:center; overflow-y:auto;">
  <div class="login-page-wrap" style="width:100%; max-width:420px; padding:20px;">
    
    <div class="card-face" id="admin-login-form" style="position:relative; width:100%; transform:none;">
      <div class="login-header">
        <img class="login-logo" src="statics/images/lighticon.png" alt="Logo">
        <div class="login-title">超级管理后台</div>
        <div class="login-subtitle">系统核心权限，请谨慎操作</div>
      </div>
      
      <div class="form-group">
        <label class="form-label">账号</label>
        <input type="text" id="admin-login-account" class="form-input" placeholder="请输入账号">
      </div>
      <div class="form-group">
        <label class="form-label">密码</label>
        <div class="password-input-wrapper">
          <input type="password" id="admin-login-pwd" class="form-input" placeholder="请输入密码">
          <span class="password-toggle-icon" onclick="togglePasswordVisibility('admin-login-pwd', this)" title="显示/隐藏密码">
            <ion-icon name="eye-off-outline"></ion-icon>
          </span>
        </div>
      </div>
      <button onclick="doAdminLogin()" class="btn-submit" style="margin-top:10px; background:#EF4444;">
        <ion-icon name="log-in-outline"></ion-icon>
        <span>安全登录</span>
      </button>
      
      <div class="login-footer" style="margin-top:20px;">
        <a href="index.html" style="color:var(--text-secondary); text-decoration:none;">&larr; 返回普通用户端首页</a>
      </div>
    </div>
    
  </div>
</div>

<div id="toast-container" style="position:fixed; top:20px; left:50%; transform:translateX(-50%); z-index:99999; display:flex; flex-direction:column; gap:8px;"></div>

<!-- 自定义确认弹窗 -->
<div id="custom-confirm-overlay" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:10000; justify-content:center; align-items:center; backdrop-filter:blur(4px);">
  <div class="paper-card fade-up d1" style="width:90%; max-width:360px; padding:24px; display:flex; flex-direction:column; gap:16px; border:none; box-shadow:0 10px 30px rgba(0,0,0,0.2);">
    <h3 id="custom-confirm-title" style="margin:0; font-size:18px; font-weight:600; color:var(--text-primary);">确认操作</h3>
    <p id="custom-confirm-msg" style="margin:0; font-size:14px; color:var(--text-secondary);"></p>
    <div style="display:flex; justify-content:flex-end; gap:12px; margin-top:8px;">
      <button id="custom-confirm-cancel" class="btn" style="padding:8px 16px; background:var(--bg-base); color:var(--text-primary); border:1px solid var(--border-color); border-radius:6px; cursor:pointer;">取消</button>
      <button id="custom-confirm-ok" class="btn btn-primary" style="padding:8px 16px;">确定</button>
    </div>
  </div>
</div>

<!-- 用户菜单 Popover -->
<div id="user-popover" class="user-popover">
  <div class="popover-item" onclick="window.location.href='index.html'">
    <ion-icon name="home-outline"></ion-icon>返回主站首页
  </div>
  <div style="height:1px; background:var(--separator); margin:4px 0;"></div>
  <div class="popover-item" style="color:var(--red-600);" onclick="logoutAdmin()">
    <ion-icon name="log-out-outline"></ion-icon>退出登录
  </div>
</div>

<script src="js/pages/superadmin_dashboard.js"></script>
<script>
  // Logo Theme Toggle
  const prefersDark = window.matchMedia('(prefers-color-scheme: dark)');
  const logoImgs = document.querySelectorAll('.login-logo');
  function updateLogo(e) {
    const src = e.matches ? 'statics/images/darkicon.png' : 'statics/images/lighticon.png';
    const scale = e.matches ? 'scale(1.2)' : 'scale(1)';
    logoImgs.forEach(img => {
      img.src = src;
      img.style.transform = scale;
    });
    document.documentElement.setAttribute('data-theme', e.matches ? 'dark' : 'light');
  }
  prefersDark.addEventListener('change', updateLogo);
  updateLogo(prefersDark);
</script>
</body>
</html>
