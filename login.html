<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#1C1C1E" media="(prefers-color-scheme: dark)" />
  <title>用户登录 - 甬学阁</title>
  <link id="favicon" rel="icon" type="image/png" href="statics/images/lighticon.png?v=3" />
  
  <!-- Ionic & Ionicons -->
  <script type="module" src="https://cdn.jsdelivr.net/npm/@ionic/core/dist/ionic/ionic.esm.js"></script>
  <script nomodule src="https://cdn.jsdelivr.net/npm/@ionic/core/dist/ionic/ionic.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@ionic/core/css/ionic.bundle.css" />
  <script type="module" src="https://cdn.jsdelivr.net/npm/ionicons/dist/ionicons/ionicons.esm.js"></script>
  <script nomodule src="https://cdn.jsdelivr.net/npm/ionicons/dist/ionicons/ionicons.js"></script>
  
  <!-- Cropper.js 图片裁剪 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.js"></script>

  <link rel="stylesheet" href="css/theme.css" />
  
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      background: var(--bg-base);
      font-family: var(--font);
      color: var(--text-primary);
      min-height: 100dvh;
      overflow-x: hidden;
    }
    
    .login-page-wrap {
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: clamp(16px, 3vh, 32px) 16px;
      box-sizing: border-box;
    }
    
    /* 3D 翻转容器 */
    .card-flip-container {
      width: 100%;
      max-width: 420px;
      perspective: 1200px;
      margin: auto;
      transition: height 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    
    .card-flipper {
      position: relative;
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
      transition: transform 0.65s cubic-bezier(0.4, 0, 0.2, 1);
    }
    
    .card-flip-container.flipped .card-flipper {
      transform: rotateY(180deg);
    }
    
    /* 卡片正面与背面 */
    .card-face {
      width: 100%;
      background: var(--bg-elevated);
      border-radius: var(--r-xl);
      box-shadow: var(--shadow-xl);
      padding: clamp(20px, 3.2vh, 32px) clamp(18px, 3vw, 28px);
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      border: 1px solid var(--separator);
    }
    
    .card-front {
      transform: rotateY(0deg);
    }
    
    .card-back {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      transform: rotateY(180deg);
    }
    
    .login-header {
      text-align: center;
      margin-bottom: clamp(12px, 2.2vh, 20px);
    }
    
    .login-logo {
      width: clamp(44px, 5.5vh, 56px);
      height: clamp(44px, 5.5vh, 56px);
      border-radius: 50%;
      object-fit: contain;
      margin-bottom: clamp(6px, 1vh, 10px);
    }
    
    .login-title {
      font-size: clamp(19px, 2.4vh, 22px);
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 4px;
    }
    
    .login-subtitle {
      font-size: clamp(12px, 1.4vh, 13px);
      color: var(--text-secondary);
    }
    
    .form-group {
      margin-bottom: clamp(9px, 1.4vh, 14px);
    }
    
    .form-label {
      display: block;
      font-size: clamp(12px, 1.4vh, 13px);
      font-weight: 500;
      color: var(--text-primary);
      margin-bottom: 4px;
    }
    
    .form-input, .form-select {
      width: 100%;
      background: var(--bg-input);
      border: 1px solid var(--border-input);
      border-radius: var(--r-md);
      padding: clamp(8px, 1.2vh, 11px) 13px;
      font-size: clamp(13px, 1.5vh, 14px);
      color: var(--text-primary);
      transition: all 0.2s;
    }
    
    .password-input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
      width: 100%;
    }
    .password-input-wrapper .form-input {
      padding-right: 38px;
    }
    .password-toggle-icon {
      position: absolute;
      right: 11px;
      color: var(--text-tertiary);
      cursor: pointer;
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.2s;
      user-select: none;
    }
    .password-toggle-icon:hover {
      color: var(--text-primary);
    }
    
    .form-input:focus, .form-select:focus {
      outline: none;
      border-color: var(--blue-500);
      background: var(--bg-elevated);
      box-shadow: 0 0 0 3px var(--blue-100);
    }
    
    @media (prefers-color-scheme: dark) {
      .form-input:focus, .form-select:focus {
        box-shadow: 0 0 0 3px var(--blue-50);
      }
    }
    
    .optional-divider {
      display: flex;
      align-items: center;
      text-align: center;
      margin: clamp(10px, 1.6vh, 16px) 0 clamp(8px, 1.2vh, 12px);
      color: var(--text-tertiary);
      font-size: clamp(11px, 1.3vh, 12px);
    }
    .optional-divider::before, .optional-divider::after {
      content: '';
      flex: 1;
      border-bottom: 1px solid var(--separator);
    }
    .optional-divider:not(:empty)::before { margin-right: 10px; }
    .optional-divider:not(:empty)::after { margin-left: 10px; }
    
    .avatar-upload {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    
    .avatar-preview {
      width: clamp(40px, 5vh, 48px);
      height: clamp(40px, 5vh, 48px);
      border-radius: 50%;
      background: var(--bg-input);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-tertiary);
      overflow: hidden;
      border: 1px solid var(--border-input);
      flex-shrink: 0;
    }
    .avatar-preview img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
    }
    
    .avatar-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: clamp(6px, 1vh, 8px) 14px;
      background: var(--blue-50);
      color: var(--blue-600);
      border: 1px solid var(--blue-100);
      border-radius: var(--r-full);
      font-size: clamp(12px, 1.4vh, 13px);
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .avatar-btn:hover {
      background: var(--blue-100);
      transform: translateY(-1px);
    }
    .avatar-btn:active {
      transform: scale(0.97);
    }
    
    .row-group {
      display: flex;
      gap: 12px;
    }
    .row-group .form-group {
      flex: 1;
      margin-bottom: clamp(9px, 1.4vh, 14px);
    }
    
    .btn-submit {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      background: var(--blue-600);
      color: #FFF;
      border: none;
      padding: clamp(10px, 1.4vh, 12px);
      border-radius: var(--r-md);
      font-size: clamp(14px, 1.6vh, 15px);
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
      margin-top: clamp(8px, 1.4vh, 14px);
      box-shadow: 0 2px 8px rgba(37, 99, 235, 0.25);
      letter-spacing: 0.3px;
    }
    .btn-submit:hover {
      background: var(--blue-700);
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.35);
      transform: translateY(-1px);
    }
    .btn-submit:active {
      transform: scale(0.985);
      box-shadow: 0 1px 4px rgba(37, 99, 235, 0.2);
    }
    .btn-submit ion-icon {
      font-size: 17px;
    }
    
    .switch-link {
      text-align: center;
      margin-top: clamp(8px, 1.2vh, 12px);
      font-size: clamp(12px, 1.4vh, 13px);
      color: var(--text-secondary);
    }
    .switch-link a {
      color: var(--text-link);
      text-decoration: none;
      font-weight: 500;
      cursor: pointer;
    }
    
    .login-footer {
      text-align: center;
      margin-top: clamp(10px, 1.6vh, 16px);
      font-size: clamp(11px, 1.3vh, 12px);
      color: var(--text-secondary);
    }
    .login-footer a {
      color: var(--text-link);
      text-decoration: none;
    }

    /* 裁剪弹窗样式 */
    .crop-modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      padding: 16px;
      animation: fadeIn 0.2s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    .crop-modal-card {
      background: var(--bg-elevated);
      border-radius: var(--r-xl);
      box-shadow: var(--shadow-xl);
      width: 100%;
      max-width: 460px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      border: 1px solid var(--separator);
      animation: scaleUp 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    @keyframes scaleUp {
      from { transform: scale(0.92); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    .crop-modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 18px;
      border-bottom: 1px solid var(--separator);
    }
    .crop-modal-title {
      font-size: 15px;
      font-weight: 600;
      color: var(--text-primary);
    }
    .crop-modal-close {
      background: none;
      border: none;
      color: var(--text-tertiary);
      font-size: 22px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      width: 32px;
      height: 32px;
      transition: background 0.2s, color 0.2s;
    }
    .crop-modal-close:hover {
      background: var(--bg-hover);
      color: var(--text-primary);
    }
    .crop-img-container {
      width: 100%;
      height: 320px;
      max-height: 50vh;
      background: #09090b;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .crop-img-container img {
      max-width: 100%;
      max-height: 100%;
      display: block;
    }
    .crop-modal-footer {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 10px;
      padding: 12px 18px;
      border-top: 1px solid var(--separator);
    }
    .crop-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 18px;
      border-radius: var(--r-md);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      border: none;
      transition: all 0.15s ease;
    }
    .crop-btn-secondary {
      background: var(--bg-hover);
      color: var(--text-primary);
    }
    .crop-btn-secondary:hover {
      background: var(--bg-active);
    }
    .crop-btn-secondary:active {
      transform: scale(0.98);
    }
    .crop-btn-primary {
      background: var(--blue-600);
      color: #FFF;
      box-shadow: 0 2px 6px rgba(37, 99, 235, 0.25);
    }
    .crop-btn-primary:hover {
      background: var(--blue-700);
      box-shadow: 0 4px 10px rgba(37, 99, 235, 0.35);
    }
    .crop-btn-primary:active {
      transform: scale(0.98);
    }

    /* 优化 Cropper.js 选框圆角与样式 */
    .cropper-view-box,
    .cropper-face {
      border-radius: 50%;
    }

    @media (max-width: 576px) {
      .login-page-wrap {
        padding: 12px;
      }
      .card-face {
        border-radius: var(--r-lg);
      }
    }
  </style>
</head>
<body>
  <div class="login-page-wrap">
    <div class="card-flip-container" id="cardFlipContainer">
      <div class="card-flipper">
        
        <!-- 正面：登录模块 -->
        <div class="card-face card-front" id="cardFront">
          <div class="login-header">
            <img class="login-logo" src="statics/images/lighticon.png" alt="Logo">
            <div class="login-title">账号登录</div>
            <div class="login-subtitle">欢迎来到甬学阁科研信息服务门户</div>
          </div>
          
          <form action="index.html" method="GET">
            <div class="form-group">
              <label class="form-label">账号 (手机号 / 邮箱)</label>
              <input type="text" class="form-input" placeholder="请输入您的账号" required>
            </div>
            <div class="form-group">
              <label class="form-label">密码</label>
              <div class="password-input-wrapper">
                <input type="password" id="loginPassword" class="form-input" placeholder="请输入密码" required>
                <span class="password-toggle-icon" onclick="togglePasswordVisibility('loginPassword', this)" title="显示/隐藏密码">
                  <ion-icon name="eye-off-outline"></ion-icon>
                </span>
              </div>
            </div>
            
            <button type="submit" class="btn-submit">
              <ion-icon name="log-in-outline"></ion-icon>
              <span>登录</span>
            </button>
          </form>
          
          <div class="switch-link">
            还没有账号？ <a onclick="toggleModule('register')">立即注册</a>
          </div>
          
          <div class="login-footer">
            继续即代表您同意 <a href="#">服务条款</a> 和 <a href="#">隐私政策</a>
          </div>
        </div>

        <!-- 背面：注册模块 -->
        <div class="card-face card-back" id="cardBack">
          <div class="login-header">
            <img class="login-logo" src="statics/images/lighticon.png" alt="Logo">
            <div class="login-title">注册新账号</div>
            <div class="login-subtitle">加入甬学阁，开启高效科研之旅</div>
          </div>
          
          <form action="index.html" method="GET" onsubmit="return validateRegister(event)">
            <div class="form-group">
              <label class="form-label">账号 (手机号 / 邮箱)</label>
              <input type="text" class="form-input" placeholder="设置您的账号" required>
            </div>
            <div class="row-group">
              <div class="form-group">
                <label class="form-label">设置密码</label>
                <div class="password-input-wrapper">
                  <input type="password" id="regPassword" class="form-input" placeholder="设置密码" required autocomplete="new-password">
                  <span class="password-toggle-icon" onclick="togglePasswordVisibility('regPassword', this)" title="显示/隐藏密码">
                    <ion-icon name="eye-off-outline"></ion-icon>
                  </span>
                </div>
              </div>
              <div class="form-group">
                <label class="form-label">确认密码</label>
                <div class="password-input-wrapper">
                  <input type="password" id="regConfirmPassword" class="form-input" placeholder="确认密码" required autocomplete="new-password">
                  <span class="password-toggle-icon" onclick="togglePasswordVisibility('regConfirmPassword', this)" title="显示/隐藏密码">
                    <ion-icon name="eye-off-outline"></ion-icon>
                  </span>
                </div>
              </div>
            </div>
            
            <div class="optional-divider">完善个人信息（选填）</div>
            
            <div class="form-group">
              <label class="form-label">头像</label>
              <div class="avatar-upload">
                <div class="avatar-preview" id="avatarPreview">
                  <ion-icon name="person-outline" size="large"></ion-icon>
                  <img id="avatarImg" src="" alt="Avatar">
                </div>
                <button type="button" class="avatar-btn" onclick="document.getElementById('avatarInput').click()">
                  <ion-icon name="cloud-upload-outline"></ion-icon>
                  <span>上传头像</span>
                </button>
                <input type="file" id="avatarInput" style="display:none" accept="image/*" onchange="previewAvatar(event)">
              </div>
            </div>
            
            <div class="form-group">
              <label class="form-label">所属机构</label>
              <input type="text" class="form-input" placeholder="如：中国科学院">
            </div>
            
            <div class="row-group">
              <div class="form-group">
                <label class="form-label">年龄</label>
                <input type="number" class="form-input" placeholder="年龄">
              </div>
              <div class="form-group">
                <label class="form-label">性别</label>
                <select class="form-select">
                  <option value="" disabled selected>请选择</option>
                  <option value="male">男</option>
                  <option value="female">女</option>
                  <option value="other">其他</option>
                </select>
              </div>
            </div>
            
            <button type="submit" class="btn-submit">
              <ion-icon name="person-add-outline"></ion-icon>
              <span>注册并进入系统</span>
            </button>
          </form>
          
          <div class="switch-link">
            已有账号？ <a onclick="toggleModule('login')">返回登录</a>
          </div>
          
          <div class="login-footer">
            继续即代表您同意 <a href="#">服务条款</a> 和 <a href="#">隐私政策</a>
          </div>
        </div>

      </div>
    </div>
  </div>

  <!-- 图片裁剪弹窗 -->
  <div id="cropModal" class="crop-modal-overlay" style="display: none;">
    <div class="crop-modal-card">
      <div class="crop-modal-header">
        <div class="crop-modal-title">裁剪头像</div>
        <button type="button" class="crop-modal-close" onclick="closeCropModal()">
          <ion-icon name="close-outline"></ion-icon>
        </button>
      </div>
      <div class="crop-img-container">
        <img id="imageToCrop" src="" alt="待裁剪图片">
      </div>
      <div class="crop-modal-footer">
        <button type="button" class="crop-btn crop-btn-secondary" onclick="closeCropModal()">取消</button>
        <button type="button" class="crop-btn crop-btn-primary" onclick="confirmCrop()">
          <ion-icon name="checkmark-outline"></ion-icon>
          <span>确认裁剪</span>
        </button>
      </div>
    </div>
  </div>

  <script>
    const container = document.getElementById('cardFlipContainer');
    const front = document.getElementById('cardFront');
    const back = document.getElementById('cardBack');
    let currentModule = 'login';
    let cropper = null;

    // 同步卡片高度
    function syncCardHeight() {
      if (currentModule === 'register') {
        container.style.height = back.offsetHeight + 'px';
      } else {
        container.style.height = front.offsetHeight + 'px';
      }
    }

    // 页面初次加载时初始化高度
    window.addEventListener('DOMContentLoaded', syncCardHeight);
    window.addEventListener('load', syncCardHeight);
    window.addEventListener('resize', syncCardHeight);

    // 3D 翻转卡片切换模块
    function toggleModule(target) {
      currentModule = target;
      if (target === 'register') {
        container.style.height = back.offsetHeight + 'px';
        container.classList.add('flipped');
      } else {
        container.style.height = front.offsetHeight + 'px';
        container.classList.remove('flipped');
      }
    }

    // 注册表单校验
    function validateRegister(e) {
      const pwd = document.getElementById('regPassword').value;
      const confirmPwd = document.getElementById('regConfirmPassword').value;
      if (pwd !== confirmPwd) {
        e.preventDefault();
        alert('两次输入的密码不一致，请重新输入');
        return false;
      }
      return true;
    }

    // 切换密码显隐
    function togglePasswordVisibility(inputId, toggleBtn) {
      const input = document.getElementById(inputId);
      const icon = toggleBtn.querySelector('ion-icon');
      if (input.type === 'password') {
        input.type = 'text';
        icon.name = 'eye-outline';
      } else {
        input.type = 'password';
        icon.name = 'eye-off-outline';
      }
    }

    // 监听系统主题变化切换Logo
    const prefersDark = window.matchMedia('(prefers-color-scheme: dark)');
    const logoImgs = document.querySelectorAll('.login-logo');
    function updateLogo(e) {
      const src = e.matches ? 'statics/images/darkicon.png' : 'statics/images/lighticon.png';
      const scale = e.matches ? 'scale(1.2)' : 'scale(1)';
      logoImgs.forEach(img => {
        img.src = src;
        img.style.transform = scale;
      });
    }
    prefersDark.addEventListener('change', updateLogo);
    updateLogo(prefersDark);
    
    // 打开图片裁剪弹窗
    function previewAvatar(event) {
      const file = event.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          const imageToCrop = document.getElementById('imageToCrop');
          imageToCrop.src = e.target.result;
          
          const modal = document.getElementById('cropModal');
          modal.style.display = 'flex';
          
          if (cropper) {
            cropper.destroy();
          }
          
          cropper = new Cropper(imageToCrop, {
            aspectRatio: 1, // 1:1 正方形/圆角头像比例
            viewMode: 1,
            dragMode: 'move',
            autoCropArea: 0.85,
            restore: false,
            guides: true,
            center: true,
            highlight: false,
            cropBoxMovable: true,
            cropBoxResizable: true,
            toggleDragModeOnDblclick: false,
          });
        };
        reader.readAsDataURL(file);
      }
    }

    // 关闭裁剪弹窗
    function closeCropModal() {
      const modal = document.getElementById('cropModal');
      modal.style.display = 'none';
      if (cropper) {
        cropper.destroy();
        cropper = null;
      }
      document.getElementById('avatarInput').value = '';
    }

    // 确认裁剪
    function confirmCrop() {
      if (!cropper) return;
      const canvas = cropper.getCroppedCanvas({
        width: 256,
        height: 256,
        imageSmoothingEnabled: true,
        imageSmoothingQuality: 'high'
      });
      
      const croppedDataUrl = canvas.toDataURL('image/png');
      const img = document.getElementById('avatarImg');
      const icon = document.querySelector('.avatar-preview ion-icon');
      img.src = croppedDataUrl;
      img.style.display = 'block';
      icon.style.display = 'none';
      
      closeCropModal();
      setTimeout(syncCardHeight, 50);
    }
  </script>
</body>
</html>
