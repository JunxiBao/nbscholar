<!-- 学术资源统一检索 -->
<div class="page-2col">

  <!-- ===== 主列：搜索结果 ===== -->
  <div class="col-main">

    <!-- 固定搜索头 -->
    <div class="sticky-top" style="padding:12px 16px;">
      <div class="search-field" style="height:44px;">
        <ion-icon name="search-outline"></ion-icon>
        <input id="main-searchbar" type="text" placeholder="关键词、标题、作者或 DOI..." value="" />
        <button class="btn btn-primary btn-sm" style="flex-shrink:0;" onclick="showToast('搜索中...')">搜索</button>
      </div>
    </div>

    <!-- 数据源 -->
    <div class="chip-bar">
      <div class="filter-chip active" data-group="source">全部来源</div>
      <div class="filter-chip" data-group="source">知网</div>
      <div class="filter-chip" data-group="source">万方</div>
      <div class="filter-chip" data-group="source">PubMed</div>
      <div class="filter-chip" data-group="source">arXiv</div>
      <div class="filter-chip" data-group="source">WoS</div>
      <div class="filter-chip" data-group="source">Scopus</div>
    </div>

    <!-- 结果统计 -->
    <div style="padding:10px 16px;display:flex;align-items:center;justify-content:space-between;">
      <span style="font-size:13px;color:var(--text-secondary);">
        找到 <strong style="color:var(--text-primary);">0</strong> 条结果
      </span>
    </div>



    <!-- 加载更多 -->
    <div style="padding:16px 16px 32px;text-align:center;">
      <button class="btn btn-muted" onclick="showToast('加载更多...')" style="min-width:160px;">加载更多结果</button>
    </div>
  </div><!-- /.col-main -->

  <!-- ===== 副列：筛选 + 工具 ===== -->
  <div class="col-aside">
    <!-- 高级筛选 -->
    <div class="section-label">高级筛选</div>
    <div style="margin:0 16px;background:var(--bg-elevated);border-radius:var(--r-lg);padding:14px;border:1px solid var(--separator);box-shadow:var(--shadow-xs);">
      <div style="display:flex;flex-direction:column;gap:10px;">
        <div>
          <div style="font-size:12px;font-weight:500;color:var(--text-secondary);margin-bottom:6px;">发表年份</div>
          <select style="width:100%;">
            <option>全部年份</option>
            <option>2024</option><option>2023</option><option selected>近5年</option>
          </select>
        </div>
        <div>
          <div style="font-size:12px;font-weight:500;color:var(--text-secondary);margin-bottom:6px;">文献类型</div>
          <select style="width:100%;">
            <option>全部类型</option>
            <option>研究论文</option><option>综述</option>
            <option>会议论文</option><option>学位论文</option>
          </select>
        </div>
        <div>
          <div style="font-size:12px;font-weight:500;color:var(--text-secondary);margin-bottom:6px;">影响因子</div>
          <select style="width:100%;">
            <option>不限</option>
            <option>IF &gt; 10</option><option>IF 5–10</option><option>IF 2–5</option>
          </select>
        </div>
        <div>
          <div style="font-size:12px;font-weight:500;color:var(--text-secondary);margin-bottom:6px;">排序方式</div>
          <select style="width:100%;">
            <option>相关度</option>
            <option>引用量</option><option>最新发表</option>
          </select>
        </div>
        <button class="btn btn-secondary btn-sm btn-full" onclick="showToast('筛选条件已应用')">应用筛选</button>
      </div>
    </div>

    <!-- AI 快速摘要 -->
    <div class="section-label">AI 快速摘要</div>
    <div style="margin:0 16px;background:var(--bg-elevated);border-radius:var(--r-lg);padding:14px;border:1px solid var(--separator);box-shadow:var(--shadow-xs);">
      <div style="font-size:13px;color:var(--text-secondary);margin-bottom:10px;line-height:1.6;">
        选中文献后，AI 自动生成结构化摘要，提取核心方法与结论。
      </div>
      <button class="btn btn-primary btn-sm btn-full" onclick="showToast('请先在左侧选择文献')">
        <ion-icon name="sparkles-outline" style="font-size:14px;"></ion-icon>
        批量生成摘要
      </button>
    </div>

    <!-- 导出 -->
    <div class="section-label">引用导出</div>
    <div style="margin:0 16px;background:var(--bg-elevated);border-radius:var(--r-lg);overflow:hidden;border:1px solid var(--separator);box-shadow:var(--shadow-xs);margin-bottom:24px;">
      <div class="list-row" onclick="showToast('BibTeX 格式已复制')">
        <ion-icon name="code-slash-outline" style="font-size:20px;color:var(--text-secondary);flex-shrink:0;"></ion-icon>
        <div class="list-text"><div class="list-title" style="font-size:14px;">BibTeX 格式</div></div>
        <ion-icon name="copy-outline" style="color:var(--text-tertiary);font-size:16px;"></ion-icon>
      </div>
      <div class="list-row" onclick="showToast('Markdown 格式已复制')">
        <ion-icon name="document-text-outline" style="font-size:20px;color:var(--text-secondary);flex-shrink:0;"></ion-icon>
        <div class="list-text"><div class="list-title" style="font-size:14px;">Markdown 格式</div></div>
        <ion-icon name="copy-outline" style="color:var(--text-tertiary);font-size:16px;"></ion-icon>
      </div>
      <div class="list-row" onclick="showToast('GB/T 7714 格式已复制')">
        <ion-icon name="list-outline" style="font-size:20px;color:var(--text-secondary);flex-shrink:0;"></ion-icon>
        <div class="list-text"><div class="list-title" style="font-size:14px;">GB/T 7714</div></div>
        <ion-icon name="copy-outline" style="color:var(--text-tertiary);font-size:16px;"></ion-icon>
      </div>
    </div>
  </div><!-- /.col-aside -->

</div><!-- /.page-2col -->
