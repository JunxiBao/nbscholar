<div class="page-1col">
  <div class="section-label fade-up d1">偏好设置</div>
  
  <div class="list-group fade-up d1">
    <div class="list-row">
      <ion-icon name="color-palette-outline" style="color:var(--text-tertiary);font-size:20px;flex-shrink:0;"></ion-icon>
      <div class="list-text">
        <div class="list-title">主题设置</div>
        <div class="list-subtitle">选择界面的深浅色模式</div>
      </div>
      <div>
        <select id="theme-select" style="background:transparent;border:1px solid var(--separator);border-radius:var(--r-sm);color:var(--text-primary);font-size:13px;padding:4px 8px;outline:none;" onchange="window.setTheme && window.setTheme(this.value)">
          <option value="system">跟随系统</option>
          <option value="dark">深色</option>
          <option value="light">浅色</option>
        </select>
      </div>
    </div>
  </div>

  <div style="margin: 16px 16px 0;">
    <button class="btn btn-full" style="background:#EF4444;color:#FFFFFF;border:none;" onclick="showToast('已退出登录')">退出登录</button>
  </div>
</div>
