<!-- 偏好设置 -->
<div class="page-1col">

  <!-- 用户信息 -->
  <div class="section-label fade-up">账户信息</div>
  <div class="list-group fade-up" id="settings-user-info">
    <div class="list-row">
      <div class="list-icon" id="settings-avatar-wrapper" style="background:var(--blue-600);overflow:hidden;">
        <ion-icon name="person-outline" id="settings-avatar-icon"></ion-icon>
        <img id="settings-avatar-img" style="display:none;width:100%;height:100%;object-fit:cover;" />
      </div>
      <div class="list-text">
        <div class="list-title" id="settings-name">加载中...</div>
        <div class="list-subtitle" id="settings-account"></div>
      </div>
    </div>
    <div class="list-row">
      <ion-icon name="business-outline" style="color:var(--text-tertiary);font-size:20px;flex-shrink:0;"></ion-icon>
      <div class="list-text">
        <div class="list-title" id="settings-institution">-</div>
        <div class="list-subtitle">所属机构</div>
      </div>
    </div>
  </div>

  <!-- 外观 -->
  <div class="section-label fade-up d1">外观</div>
  <div class="list-group fade-up d1">
    <div class="list-row">
      <ion-icon name="color-palette-outline" style="color:var(--text-tertiary);font-size:20px;flex-shrink:0;"></ion-icon>
      <div class="list-text">
        <div class="list-title">主题模式</div>
        <div class="list-subtitle">选择界面的深浅色模式</div>
      </div>
      <div>
        <select id="theme-select"
          style="background:transparent;border:1px solid var(--separator);border-radius:var(--r-sm);
                 color:var(--text-primary);font-size:13px;padding:4px 8px;outline:none;"
          onchange="window.setTheme && window.setTheme(this.value)">
          <option value="system">跟随系统</option>
          <option value="dark">深色</option>
          <option value="light">浅色</option>
        </select>
      </div>
    </div>
  </div>

  <!-- 关于 -->
  <div class="section-label fade-up d2">关于</div>
  <div class="list-group fade-up d2">
    <div class="list-row">
      <ion-icon name="information-circle-outline" style="color:var(--text-tertiary);font-size:20px;flex-shrink:0;"></ion-icon>
      <div class="list-text">
        <div class="list-title">甬学阁</div>
        <div class="list-subtitle">一站式科研信息服务门户 v1.0</div>
      </div>
    </div>
  </div>

  <!-- 退出登录 -->
  <div style="margin:24px 16px 0; display: flex; flex-wrap: wrap; gap: 12px;">
    <button class="btn btn-full" id="logout-btn"
      style="flex: 1; min-width: 120px; background:#EF4444;color:#FFFFFF;border:none;padding:12px 0;border-radius:var(--r-md);">
      <ion-icon name="log-out-outline" style="font-size:18px;margin-right:6px;"></ion-icon>
      退出登录
    </button>
    <button class="btn btn-full" id="delete-account-btn"
      style="flex: 1; min-width: 120px; background:transparent;color:#EF4444;border:1px solid #EF4444;padding:12px 0;border-radius:var(--r-md);">
      <ion-icon name="warning-outline" style="font-size:18px;margin-right:6px;"></ion-icon>
      注销账号
    </button>
  </div>
  <div style="height:32px;"></div>

  <!-- 账号注销二次确认弹窗 -->
  <div id="delete-confirm-modal" style="display:none; position:fixed; top:0; left:0; width:100vw; height:100vh; background:rgba(0,0,0,0.6); z-index:9999; align-items:center; justify-content:center; backdrop-filter:blur(4px);">
    <div style="background:var(--bg-primary); width:320px; border-radius:var(--r-lg); padding:24px; box-shadow:var(--shadow-lg); text-align:center;" class="fade-up">
      <ion-icon name="alert-circle-outline" style="font-size:48px; color:var(--red-500); margin-bottom:16px;"></ion-icon>
      <h3 style="margin:0 0 12px 0; font-size:18px; color:var(--text-primary); font-weight:600;" id="delete-modal-title">危险操作确认</h3>
      <p style="margin:0 0 24px 0; font-size:14px; color:var(--text-secondary); line-height:1.5;" id="delete-modal-desc">您确定要注销账号并删除所有相关数据吗？此操作不可逆！</p>
      <div style="display:flex; gap:12px;">
        <button class="btn btn-secondary" style="flex:1; border-radius:var(--r-md);" onclick="window.closeDeleteModal && window.closeDeleteModal()">取消</button>
        <button class="btn" style="flex:1; background:var(--red-500); color:white; border:none; border-radius:var(--r-md);" id="delete-modal-confirm-btn">确定</button>
      </div>
    </div>
  </div>
</div>
