<!-- 首页 — 宽屏双列布局 -->
<div class="page-2col">

  <!-- ===== 主列 ===== -->
  <div class="col-main">

    <!-- 用户信息 + 搜索 -->
    <div style="background:var(--bg-elevated);border-bottom:1px solid var(--separator);padding:20px 20px 16px;" class="fade-up">
      <div style="display:flex;align-items:center;gap:14px;margin-bottom:16px;">
        <img class="avatar" id="home-avatar" src="statics/images/wang.png" alt="User" style="width:50px;height:50px;object-fit:cover;">
        <div style="flex:1;">
          <div style="font-size:18px;font-weight:600;color:var(--text-primary);letter-spacing:-0.3px;"><span id="greeting-text">早上好</span>，<span id="greeting-name">用户</span> 👋</div>
          <div style="font-size:13px;color:var(--text-secondary);margin-top:2px;" id="home-institution"></div>
        </div>

      </div>
      <!-- 搜索框 -->
      <div class="search-field" style="height:46px;">
        <ion-icon name="search-outline"></ion-icon>
        <input id="hero-search" type="text" placeholder="搜索文献、作者、关键词或 DOI..." />
        <button id="hero-search-btn" class="btn btn-primary btn-sm" style="flex-shrink:0;">搜索</button>
      </div>

    </div>

    <!-- 统计 -->
    <div class="stat-row" style="padding-top:16px;" class="fade-up d1">
      <div class="stat-card fade-up d1">
        <div class="stat-val">-</div>
        <div class="stat-lbl">历史检索</div>
      </div>
      <div class="stat-card fade-up d1">
        <div class="stat-val">-</div>
        <div class="stat-lbl">收藏文献</div>
      </div>
      <div class="stat-card fade-up d1">
        <div class="stat-val">-</div>
        <div class="stat-lbl">培训报名</div>
      </div>
    </div>

    <!-- 六大功能 -->
    <div class="section-label fade-up d2">核心功能</div>
    <div class="module-grid fade-up d2" style="padding-bottom:4px;">
      <div class="module-tile" data-navigate="tab-search">
        <div class="tile-icon" style="background:#2563EB;"><ion-icon name="search"></ion-icon></div>
        <div class="tile-label">学术<br>检索</div>
      </div>
      <div class="module-tile" data-navigate="tab-tools">
        <div class="tile-icon" style="background:#7C3AED;"><ion-icon name="flash"></ion-icon></div>
        <div class="tile-label">智能<br>工具</div>
      </div>
      <div class="module-tile" data-navigate="tab-data">
        <div class="tile-icon" style="background:#059669;"><ion-icon name="cloud-upload"></ion-icon></div>
        <div class="tile-label">数据<br>存缴</div>
      </div>
      <div class="module-tile" data-navigate="tab-journal">
        <div class="tile-icon" style="background:#D97706;"><ion-icon name="newspaper"></ion-icon></div>
        <div class="tile-label">期刊<br>投稿</div>
      </div>
      <div class="module-tile" data-navigate="tab-training">
        <div class="tile-icon" style="background:#DC2626;"><ion-icon name="school"></ion-icon></div>
        <div class="tile-label">培训<br>报名</div>
      </div>
    </div>

    <!-- 最近检索 -->
    <div class="section-label fade-up d3">最近检索</div>
    <div class="list-group fade-up d3" style="margin-bottom:0;">
      <div style="min-height: 50px; display: flex; align-items: center; justify-content: center; font-size: 13px; color: var(--text-tertiary);">
        暂无近期检索记录
      </div>
    </div>

    <!-- 收藏的文献预览 (宽屏主列补充内容) -->
    <div class="section-label fade-up d4">
      收藏文献
      <span class="section-label-action" onclick="switchTab('tab-search')"></span>
    </div>

    <div class="paper-card fade-up d4">
      <div style="text-align: center; color: var(--text-tertiary); font-size: 13px; padding: 24px;">
        暂无收藏文献
      </div>
    </div>

    <div style="height:24px;"></div>
  </div><!-- /.col-main -->

  <!-- ===== 副列 (宽屏右侧面板) ===== -->
  <div class="col-aside">
    <!-- 近期日程 -->
    <div class="section-label">
      近期日程
      <span class="section-label-action" onclick="switchTab('tab-training')">查看全部</span>
    </div>

    <div class="list-group" style="margin-bottom:0;">
      <div class="list-row" onclick="showToast('查看日程详情')">
        <div class="list-icon" style="background:#2563EB;"><ion-icon name="videocam-outline"></ion-icon></div>
        <div class="list-text">
          <div class="list-title" style="font-size:14px;">数据分析基础培训</div>
          <div class="list-subtitle">09/15 14:00 · 线上直播</div>
        </div>
        <span class="chip chip-green" style="font-size:11px;">已报名</span>
      </div>
      <div class="list-row" onclick="showToast('查看日程详情')">
        <div class="list-icon" style="background:#7C3AED;"><ion-icon name="location-outline"></ion-icon></div>
        <div class="list-text">
          <div class="list-title" style="font-size:14px;">高水平论文写作技巧</div>
          <div class="list-subtitle">10/08 10:00 · 北京</div>
        </div>
        <span class="chip chip-amber" style="font-size:11px;">待签到</span>
      </div>
    </div>



    <!-- 近期培训快报 -->
    <div class="section-label">近期培训</div>
    <div style="margin:0 16px;background:var(--bg-elevated);border-radius:var(--r-lg);overflow:hidden;border:1px solid var(--separator);box-shadow:var(--shadow-xs);">
      <div style="height:4px;background:#2563EB;"></div>
      <div style="padding:12px 14px;">
        <div style="font-size:13px;font-weight:500;color:var(--text-primary);margin-bottom:4px;">科学数据分析基础：R 语言</div>
        <div style="font-size:12px;color:var(--text-secondary);margin-bottom:10px;">09/15 · 线上 · 128/200 人</div>
        <button class="btn btn-primary btn-sm btn-full" onclick="showToast('已成功报名！')">一键报名</button>
      </div>
    </div>

    <!-- 快速导航 -->
    <div class="section-label">快速操作</div>
    <div style="margin:0 16px;display:flex;flex-direction:column;gap:8px;padding-bottom:24px;">
      <button class="btn btn-muted btn-full" style="justify-content:flex-start;gap:10px;" onclick="switchTab('tab-data')">
        <ion-icon name="cloud-upload-outline" style="font-size:18px;color:var(--green-600);"></ion-icon>
        开始数据存缴向导
      </button>
      <button class="btn btn-muted btn-full" style="justify-content:flex-start;gap:10px;" onclick="switchTab('tab-journal')">
        <ion-icon name="sparkles-outline" style="font-size:18px;color:var(--amber-500);"></ion-icon>
        AI 智能选刊
      </button>
      <button class="btn btn-muted btn-full" style="justify-content:flex-start;gap:10px;" onclick="switchTab('tab-tools')">
        <ion-icon name="language-outline" style="font-size:18px;color:var(--blue-600);"></ion-icon>
        打开双语翻译工具
      </button>
    </div>
  </div><!-- /.col-aside -->

</div><!-- /.page-2col -->
