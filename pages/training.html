<!-- 公益培训报名 -->

<!-- 月历容器 -->
<div style="padding: 16px 16px 4px;">
  <div class="paper-card" style="padding: 0; overflow: hidden; box-shadow: var(--shadow-sm); border: 1px solid var(--separator); background: var(--bg-elevated);">
    <!-- 月份导航 -->
    <div style="display:flex;align-items:center;justify-content:space-between;padding:16px 20px 12px; border-bottom: 1px solid var(--separator); background: var(--bg-header);">
      <button id="cal-prev-btn" style="background:var(--bg-hover);border:none;cursor:pointer;color:var(--text-primary);padding:8px;display:flex;align-items:center;border-radius:50%;transition:background 0.2s;" aria-label="上一月">
        <ion-icon name="chevron-back-outline" style="font-size:18px;"></ion-icon>
      </button>
      <span id="cal-month-title" style="font-size:17px;font-weight:700;color:var(--text-primary);letter-spacing:0.5px;">2026年 9月</span>
      <button id="cal-next-btn" style="background:var(--bg-hover);border:none;cursor:pointer;color:var(--text-primary);padding:8px;display:flex;align-items:center;border-radius:50%;transition:background 0.2s;" aria-label="下一月">
        <ion-icon name="chevron-forward-outline" style="font-size:18px;"></ion-icon>
      </button>
    </div>

    <!-- 周标头 -->
    <div style="display:grid;grid-template-columns:repeat(7,1fr);padding:16px 12px 8px;">
      <div style="text-align:center;font-size:13px;font-weight:600;color:var(--text-tertiary);">日</div>
      <div style="text-align:center;font-size:13px;font-weight:600;color:var(--text-secondary);">一</div>
      <div style="text-align:center;font-size:13px;font-weight:600;color:var(--text-secondary);">二</div>
      <div style="text-align:center;font-size:13px;font-weight:600;color:var(--text-secondary);">三</div>
      <div style="text-align:center;font-size:13px;font-weight:600;color:var(--text-secondary);">四</div>
      <div style="text-align:center;font-size:13px;font-weight:600;color:var(--text-secondary);">五</div>
      <div style="text-align:center;font-size:13px;font-weight:600;color:var(--text-tertiary);">六</div>
    </div>

    <!-- 日期格子动态容器 -->
    <div id="training-calendar-days" style="display:grid;grid-template-columns:repeat(7,1fr);padding:0 12px 16px;gap:8px 0;min-height:200px;">
      <!-- 由 JS 动态渲染 -->
    </div>
  </div>
</div>

<!-- 分类筛选 -->
<div class="chip-bar">
  <div class="filter-chip active" data-group="train-cat">全部</div>
  <div class="filter-chip" data-group="train-cat">线上直播</div>
  <div class="filter-chip" data-group="train-cat">线下讲座</div>
  <div class="filter-chip" data-group="train-cat">录播课程</div>
  <div class="filter-chip" data-group="train-cat">工作坊</div>
</div>

<!-- 活动列表 -->
<div class="section-label">近期活动 <span style="font-weight:400;color:var(--text-secondary);">共 0 场</span></div>
<div id="training-events-grid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; padding: 0 16px; margin-bottom: 24px;"></div>
