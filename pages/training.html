<!-- 公益培训报名 -->

<!-- 月历 -->
<div style="background:var(--bg-primary);border-bottom:1px solid var(--separator);">
  <!-- 月份导航 -->
  <div style="display:flex;align-items:center;justify-content:space-between;padding:14px 16px 8px;">
    <button style="background:none;border:none;cursor:pointer;color:var(--text-secondary);padding:4px;display:flex;align-items:center;">
      <ion-icon name="chevron-back-outline" style="font-size:20px;"></ion-icon>
    </button>
    <span style="font-size:16px;font-weight:600;color:var(--text-primary);">2026年 9月</span>
    <button style="background:none;border:none;cursor:pointer;color:var(--text-secondary);padding:4px;display:flex;align-items:center;">
      <ion-icon name="chevron-forward-outline" style="font-size:20px;"></ion-icon>
    </button>
  </div>

  <!-- 周标头 -->
  <div style="display:grid;grid-template-columns:repeat(7,1fr);padding:0 12px;">
    <div style="text-align:center;padding:4px 0;font-size:12px;color:var(--text-tertiary);">日</div>
    <div style="text-align:center;padding:4px 0;font-size:12px;color:var(--text-tertiary);">一</div>
    <div style="text-align:center;padding:4px 0;font-size:12px;color:var(--text-tertiary);">二</div>

    <div style="text-align:center;padding:4px 0;font-size:12px;color:var(--text-tertiary);">四</div>
    <div style="text-align:center;padding:4px 0;font-size:12px;color:var(--text-tertiary);">五</div>
    <div style="text-align:center;padding:4px 0;font-size:12px;color:var(--text-secondary);font-weight:500;">六</div>
  </div>

  <!-- 日期格子 -->
  <div style="display:grid;grid-template-columns:repeat(7,1fr);padding:4px 12px 12px;gap:2px 0;">

    <div style="text-align:center;padding:5px 0;font-size:14px;color:var(--text-secondary);">1</div>
