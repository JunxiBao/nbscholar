<!-- 公益培训报名 -->

<!-- 月历 -->
<div style="background:var(--bg-primary);border-bottom:1px solid var(--separator);">
  <!-- 月份导航 -->
  <div style="display:flex;align-items:center;justify-content:space-between;padding:14px 16px 8px;">
    <button id="cal-prev-btn" style="background:none;border:none;cursor:pointer;color:var(--text-secondary);padding:6px;display:flex;align-items:center;border-radius:var(--r-sm);" aria-label="上一月">
      <ion-icon name="chevron-back-outline" style="font-size:20px;"></ion-icon>
    </button>
    <span id="cal-month-title" style="font-size:16px;font-weight:600;color:var(--text-primary);">2026年 9月</span>
    <button id="cal-next-btn" style="background:none;border:none;cursor:pointer;color:var(--text-secondary);padding:6px;display:flex;align-items:center;border-radius:var(--r-sm);" aria-label="下一月">
      <ion-icon name="chevron-forward-outline" style="font-size:20px;"></ion-icon>
    </button>
  </div>

  <!-- 周标头 -->
  <div style="display:grid;grid-template-columns:repeat(7,1fr);padding:0 12px;">
    <div style="text-align:center;padding:4px 0;font-size:12px;color:var(--text-tertiary);">日</div>
    <div style="text-align:center;padding:4px 0;font-size:12px;color:var(--text-tertiary);">一</div>
    <div style="text-align:center;padding:4px 0;font-size:12px;color:var(--text-tertiary);">二</div>
    <div style="text-align:center;padding:4px 0;font-size:12px;color:var(--text-tertiary);">三</div>
    <div style="text-align:center;padding:4px 0;font-size:12px;color:var(--text-tertiary);">四</div>
    <div style="text-align:center;padding:4px 0;font-size:12px;color:var(--text-tertiary);">五</div>
    <div style="text-align:center;padding:4px 0;font-size:12px;color:var(--text-secondary);font-weight:500;">六</div>
  </div>

  <!-- 日期格子动态容器 -->
  <div id="training-calendar-days" style="display:grid;grid-template-columns:repeat(7,1fr);padding:4px 12px 12px;gap:2px 0;min-height:200px;">
    <!-- 由 JS 动态渲染 -->
  </div>
</div>

<!-- 分类筛选 -->
<div class="chip-bar">
  <div class="filter-chip active" data-group="train-cat">全部</div>
  <div class="filter-chip" data-group="train-cat">线上直播</div>
  <div class="filter-chip" data-group="train-cat">线下讲座</div>
  <div class="filter-chip" data-group="train-cat">录播课程</div>
  <div class="filter-chip" data-group="train-cat">工作坊</div>
</div>

<!-- 活动列表 -->
<div class="section-label">近期活动 <span style="font-weight:400;color:var(--text-secondary);">共 0 场</span></div>
<div id="training-events-grid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; padding: 0 16px; margin-bottom: 24px;"></div>
