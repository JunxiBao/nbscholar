<!-- 智能工具 -->



<!-- AI 助手 -->
<div class="section-label">
  AI 文献助手
</div>

<div class="chat-wrap fade-up" style="margin-bottom:24px;">
  <div class="chat-header" style="display:flex; justify-content:space-between; align-items:center;">
    <div class="chat-status">
      <div class="chat-dot"></div>
      <div style="position:relative; display:flex; align-items:center; background:var(--bg-secondary); padding:4px 28px 4px 10px; border-radius:var(--r-full); border:1px solid var(--separator); cursor:pointer;">
        <select id="chat-model-select" style="background:transparent; border:none; color:var(--text-primary); font-size:13px; font-weight:500; padding:0; margin:0; appearance:none; cursor:pointer; outline:none; font-family:var(--font); z-index:1; width:100%;">
          <option value="deepseek-chat">DeepSeek Chat</option>
          <option value="deepseek-reasoner">DeepSeek Reasoner</option>
        </select>
        <ion-icon name="chevron-down-outline" style="font-size:12px; color:var(--text-tertiary); position:absolute; right:10px; pointer-events:none; z-index:0;"></ion-icon>
      </div>
    </div>
    
    <div id="chat-header-actions" style="display:flex; gap:8px;">
      <button class="btn btn-muted btn-sm" onclick="window.newChat && window.newChat()" title="新建对话">
        <ion-icon name="add-outline" style="font-size:16px; margin:0;"></ion-icon>
      </button>
      <button class="btn btn-muted btn-sm" onclick="window.openHistoryModal && window.openHistoryModal()" title="历史记录">
        <ion-icon name="time-outline" style="font-size:16px; margin:0;"></ion-icon>
      </button>
    </div>
  </div>

  <div id="chat-messages">
    <div class="msg-row">
      <div class="msg-avatar">
        <ion-icon name="sparkles-outline"></ion-icon>
      </div>
      <div class="msg-bubble ai">
        您好！我是您的科研 AI 助手。您可以粘贴文献内容让我生成摘要、提取数据，或者直接提问。
      </div>
    </div>
  </div>

  <div class="chat-shortcuts" id="chat-shortcuts-container">
    <button class="shortcut-pill" onclick="fillChat('请帮我总结这篇文献的核心方法和主要结论')">总结文献</button>
    <button class="shortcut-pill" onclick="fillChat('提取这篇文献的核心数据和实验结果')">提取数据</button>
    <button class="shortcut-pill" onclick="fillChat('分析该研究的创新点和局限性')">分析创新点</button>
    <button class="shortcut-pill" onclick="fillChat('将以下摘要翻译为中文并润色')">翻译润色</button>
  </div>

  <div class="chat-input-row">
    <textarea id="chat-input" placeholder="输入问题或粘贴文献内容..." rows="1"></textarea>
    <button id="chat-send"><ion-icon name="arrow-up"></ion-icon></button>
  </div>
</div>

<!-- 聊天历史弹窗 -->
<div id="chat-history-modal" style="display:none; position:fixed; top:0; left:0; width:100vw; height:100vh; background:rgba(0,0,0,0.4); z-index:9999; align-items:center; justify-content:center; backdrop-filter:blur(8px);">
  <div style="background:var(--bg-elevated); width:360px; max-height:80vh; display:flex; flex-direction:column; border-radius:var(--r-lg); box-shadow:var(--shadow-xl); border:1px solid var(--separator); transform:scale(0.95); animation:modalPopIn 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;">
    <div style="padding:16px; border-bottom:1px solid var(--separator); display:flex; justify-content:space-between; align-items:center;">
      <h3 style="margin:0; font-size:16px; font-weight:600;">历史会话</h3>
      <ion-icon name="close-outline" style="font-size:20px; cursor:pointer; color:var(--text-tertiary);" onclick="window.closeHistoryModal && window.closeHistoryModal()"></ion-icon>
    </div>
    <div id="chat-history-list" style="flex:1; overflow-y:auto; padding:12px;">
      <div style="text-align:center; padding:20px; color:var(--text-tertiary); font-size:13px;">加载中...</div>
    </div>
  </div>
</div>

<style>
@keyframes modalPopIn {
  from { opacity: 0; transform: scale(0.95) translateY(10px); }
  to { opacity: 1; transform: scale(1) translateY(0); }
}
.chat-session-item {
  padding: 12px 14px;
  border-radius: var(--r-md);
  margin-bottom: 6px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: space-between;
  transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
  color: var(--text-secondary);
  font-size: 14px;
  border: 1px solid transparent;
}
.chat-session-item:hover { 
  background: var(--bg-hover);
  transform: translateX(2px);
}
.chat-session-item.active {
  background: linear-gradient(90deg, rgba(37,99,235,0.08), transparent);
  border-left: 3px solid var(--blue-600);
  color: var(--blue-700);
  font-weight: 600;
  border-radius: 4px var(--r-md) var(--r-md) 4px;
}
[data-theme="dark"] .chat-session-item.active {
  background: linear-gradient(90deg, rgba(96,165,250,0.15), transparent);
  border-left-color: #60A5FA;
  color: #93C5FD;
}
.chat-session-title { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display:flex; align-items:center; gap:8px;}
.chat-session-title ion-icon { font-size:16px; color:var(--text-tertiary); transition: color 0.2s; }
.chat-session-item.active .chat-session-title ion-icon { color:inherit; }
.chat-session-del { padding: 6px; border-radius: 6px; display: none; color: var(--red-500); transition: all 0.2s; }
.chat-session-item:hover .chat-session-del { display: flex; animation: fadeUp 0.2s ease forwards; }
.chat-session-del:hover { background: rgba(239, 68, 68, 0.1); transform:scale(1.1); }
</style>

<script>
function fillChat(text) {
  const inp = document.getElementById('chat-input');
  if (inp) { inp.value = text; inp.focus(); }
}
</script>

<!-- 工具列表 -->
<div class="section-label">可用工具</div>

<div class="tool-row fade-up" onclick="openToolModal('demo-translate', '双语翻译与专业润色')">
  <div class="tool-row-icon" style="background:#0891B2;">
    <ion-icon name="language-outline"></ion-icon>
  </div>
  <div class="tool-row-body">
    <div class="tool-row-name">双语翻译与专业润色</div>
    <div class="tool-row-desc">针对学术术语优化，支持中英互译、段落润色及划词翻译</div>
    <div style="display:flex;gap:6px;margin-top:8px;">
      <span class="chip chip-blue">中→英</span>
      <span class="chip chip-blue">英→中</span>
      <span class="chip chip-gray">润色</span>
    </div>
  </div>
  <ion-icon name="chevron-forward-outline" style="color:var(--text-tertiary);font-size:18px;flex-shrink:0;align-self:center;"></ion-icon>
</div>

<div class="tool-row fade-up d1" onclick="openToolModal('demo-vis', '数据可视化轻工具')">
  <div class="tool-row-icon" style="background:#059669;">
    <ion-icon name="bar-chart-outline"></ion-icon>
  </div>
  <div class="tool-row-body">
    <div class="tool-row-name">数据可视化轻工具</div>
    <div class="tool-row-desc">导入 CSV 一键生成折线图、散点图、热图，支持导出高分辨率图片</div>
    <div style="display:flex;gap:6px;margin-top:8px;">
      <span class="chip chip-green">CSV 导入</span>
      <span class="chip chip-green">高清导出</span>
    </div>
  </div>
  <ion-icon name="chevron-forward-outline" style="color:var(--text-tertiary);font-size:18px;flex-shrink:0;align-self:center;"></ion-icon>
</div>

<div class="tool-row fade-up d2" onclick="openToolModal('demo-cite', '引用格式批量转换')">
  <div class="tool-row-icon" style="background:#D97706;">
    <ion-icon name="swap-horizontal-outline"></ion-icon>
  </div>
  <div class="tool-row-body">
    <div class="tool-row-name">引用格式批量转换</div>
    <div class="tool-row-desc">支持 APA、MLA、GB/T 7714、Vancouver、BibTeX、RIS 等格式互转</div>
    <div style="display:flex;gap:6px;margin-top:8px;">
      <span class="chip chip-amber">BibTeX</span>
      <span class="chip chip-amber">GB/T 7714</span>
    </div>
  </div>
  <ion-icon name="chevron-forward-outline" style="color:var(--text-tertiary);font-size:18px;flex-shrink:0;align-self:center;"></ion-icon>
</div>



<!-- ===== 工具全屏演示弹窗 ===== -->
<div id="tool-demo-modal" class="tool-modal">
  <div class="tool-modal-header">
    <button class="tool-modal-close" onclick="closeToolModal()">
      <ion-icon name="arrow-back-outline"></ion-icon>
      返回工具列表
    </button>
    <div class="tool-modal-title" id="tool-modal-title">工具演示</div>
    <div style="width:100px;"></div>
  </div>
  
  <div class="tool-modal-content">
    
    <!-- 1. 双语翻译与专业润色 -->
    <div id="demo-translate" class="demo-panel" style="display:none;">
      <div class="demo-controls">
        <select id="trans-type" class="demo-select">
          <option value="zh2en">中译英</option>
          <option value="en2zh">英译中</option>
          <option value="polish">学术润色</option>
        </select>
        <button class="btn btn-primary" onclick="demoTranslate()">
          <ion-icon name="language-outline"></ion-icon>
          开始处理
        </button>
      </div>
      <div class="trans-split">
        <div class="trans-col">
          <label class="trans-label">原文</label>
          <textarea id="trans-src" class="trans-textarea" placeholder="输入或粘贴需要翻译/润色的文本..."></textarea>
        </div>
        <div class="trans-col">
          <label class="trans-label">结果 <ion-spinner name="dots" id="trans-spinner" style="display:none;width:16px;height:16px;margin-left:8px;"></ion-spinner></label>
          <div id="trans-res" class="trans-result-area">
            <div class="trans-placeholder">处理结果将在此显示...</div>
          </div>
        </div>
      </div>
    </div>
    
    <!-- 2. 数据可视化 -->
    <div id="demo-vis" class="demo-panel" style="display:none; flex-direction:column; height:100%;">
      <div class="demo-controls">
        <input type="file" id="csv-upload" accept=".csv" style="display:none;" onchange="handleCSVUpload(event)">
        <button class="btn btn-secondary" onclick="document.getElementById('csv-upload').click()">
          <ion-icon name="cloud-upload-outline"></ion-icon>
          上传 CSV 数据
        </button>
        <div style="display:flex;gap:8px;margin-left:auto;">
          <button class="btn btn-muted btn-sm" onclick="demoChartType('line')">折线图</button>
          <button class="btn btn-muted btn-sm" onclick="demoChartType('bar')">柱状图</button>
          <button class="btn btn-muted btn-sm" onclick="demoChartType('scatter')">散点图</button>
        </div>
      </div>
      <div id="echarts-container" style="flex:1; width:100%; background:var(--bg-elevated); border-radius:var(--r-md); border:1px solid var(--separator); margin-top:16px;"></div>
    </div>
    
    <!-- 3. 引用格式转换 -->
    <div id="demo-cite" class="demo-panel" style="display:none;">
      <div class="trans-col" style="height:150px; margin-bottom:16px;">
        <label class="trans-label">输入 BibTeX 或 RIS</label>
        <textarea id="cite-src" class="trans-textarea" placeholder="粘贴引用代码，或通过下方按钮上传文件..."></textarea>
      </div>
      <div class="demo-controls" style="margin-bottom:16px;">
        <input type="file" id="cite-upload" accept=".bib,.ris" style="display:none;" onchange="handleCiteUpload(event)">
        <button class="btn btn-secondary" onclick="document.getElementById('cite-upload').click()" style="margin-right:auto;">
          <ion-icon name="cloud-upload-outline"></ion-icon>
          上传 .bib / .ris
        </button>
        <select id="cite-format" class="demo-select">
          <option value="gbt">GB/T 7714-2015</option>
          <option value="apa">APA 7th</option>
          <option value="mla">MLA 9th</option>
        </select>
        <button class="btn btn-primary" onclick="demoCite()">
          <ion-icon name="swap-horizontal-outline"></ion-icon>
          批量转换
        </button>
      </div>
      <div class="trans-col" style="flex:1;">
        <label class="trans-label">转换结果 <ion-spinner name="dots" id="cite-spinner" style="display:none;width:16px;height:16px;margin-left:8px;"></ion-spinner></label>
        <div id="cite-res" class="trans-result-area" style="font-family:serif; font-size:16px; line-height:1.8;">
          <div class="trans-placeholder">格式化结果将在此显示...</div>
        </div>
      </div>
    </div>
    
  </div>
</div>
